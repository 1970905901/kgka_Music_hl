name: Build iOS IPA for TrollStore

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Recreate iOS project
        run: |
          # 完全删除并重建 iOS 项目
          rm -rf ios/
          flutter create --platforms=ios .
          
          # 添加后台音频权限到 Info.plist
          cd ios/Runner
          /usr/libexec/PlistBuddy -c "Add UIBackgroundModes array" Info.plist
          /usr/libexec/PlistBuddy -c "Add UIBackgroundModes:0 string audio" Info.plist
          cd ../..

      - name: Build iOS app (unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r kgka_music.ipa Payload
          echo "✅ IPA created successfully!"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: kgka-music-unsigned
          path: kgka_music.ipa
          retention-days: 30
